name: macOS

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'scripts/test.sh', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'scripts/test.sh', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: scripts/test.sh
